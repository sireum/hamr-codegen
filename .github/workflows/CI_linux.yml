name: Linux

on:
  push:
  schedule:
    - cron: "0 2 * * 6" # every sunday at 2am
  workflow_dispatch:
    inputs:
      verbose:
        type: boolean
        description: Enable verbose testing output
        default: false

# a new run of this workflow on the same ref cancels the one in progress, so superseded
# pushes do not hold runners (in particular the organization's few macOS runners)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ci:
    runs-on: ubuntu-24.04
    # ros2 tests running in the github action started failing Jan 2026 due to
    # "ModuleNotFoundError: No module named 'ament_package'". It wasn't clear what change to the ubuntu-24.04 runner
    # caused the issue. Switching to a vanilla ubuntu-24.04 docker image resolved the issue
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        testSuffix:
          # Rows are balanced against per-suite times from the last green run. CodeGenTest_Base is
          # the longest single suite, so it runs alone and sets the floor for the whole matrix --
          # adding further rows cannot bring the run in under it.
          - "CodeGenTest_Base"
          - "CodegenTest_CASE"
          - "BaseBehaviorTestDynamic,GumboTest,HamrTranspileTests,SysVCTest,SysVCVerusGenTest"
          - "BaseBehaviorTestStatic,MicrokitTests,MicrokitBehaviorTests,SharedMemorySafetyTests,GumboExpRenderingTests,SystemTestingTests,R2U2MonitorTests,R2U2MonitorBehaviorTests,SymlinkAuxCodeTest,CParserTest,TimeUtilTests,ExactTimeTests,ExactTimeResolveTests,SlangExp2RustTests,Ros2Tests"
    name: '${{ matrix.testSuffix }}'
    steps:
      - name: Install Required Tools
        run: |
          apt-get update -y && apt-get install -y git wget curl zip unzip build-essential
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Retrieve versions.properties
        run: |
          wget -q https://raw.githubusercontent.com/sireum/kekinian/master/versions.properties
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: bin/scala
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-coursier
      - name: Cache OSATE
        id: cache-osate
        uses: actions/cache@v5
        with:
          path: bin/linux/osate
          key: ${{ runner.os }}-${{ hashFiles('jvm/src/main/resources/phantom_versions.properties') }}-osate
      - name: Install ROS2 Jazzy
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install software-properties-common -y
          add-apt-repository -y universe
          apt-get update -y
          # The tag comes from the releases/latest redirect rather than the API: the API
          # allows 60 unauthenticated requests an hour per IP, which GitHub's runners
          # share, and an exhausted limit left the version empty and the .deb a 404 page.
          ROS_APT_SOURCE_VERSION=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/ros-infrastructure/ros-apt-source/releases/latest)
          export ROS_APT_SOURCE_VERSION=${ROS_APT_SOURCE_VERSION##*/}
          case "$ROS_APT_SOURCE_VERSION" in
            ''|latest) echo "::error::could not determine the latest ros-apt-source release"; exit 1 ;;
          esac
          curl -fL -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
          dpkg -i /tmp/ros2-apt-source.deb
          apt-get update -y
          apt-get install ros-dev-tools ros-jazzy-ros-base -y
      - name: Test
        env:
          # add verbose flag if workflow is restarted with "enable debug logging" checked or if requested
          # via workflow dispatch
          VERBOSE_DEBUG: ${{ ( runner.debug == '1' || inputs.verbose == '1' ) && ',verbose' || '' }}
        run: |
          [ -d /opt/ros/jazzy ] && export ROS2_HOME=/opt/ros/jazzy

          # x86_64 JVM defaults to 1MB thread stack; scalac plugin 4.20260224+ overflows during Erasure phase
          export JAVA_OPTS="-Xss4m"
          export COURSIER_CACHE=$GITHUB_WORKSPACE/cache/coursier
          cd $GITHUB_WORKSPACE
          
          # see https://github.com/sireum/osate-plugin/blob/57785407d84793cf1f8d5926647e4dc75ab197a9/org.sireum.aadl.osate.cli/src/org/sireum/aadl/osate/cli/Phantom.java#L508-L517
          export CHECK_PHANTOM_HAMR_API_COMPATIBILITY=true
          
          export testmodes=phantom,sergen,slangcheck,tipe,ive,compile,generated_unit_tests,smt2${VERBOSE_DEBUG}
          echo "testmodes=${testmodes}"
          export SMT2_TIMEOUT=180000
          echo "SMT2_TIMEOUT=${SMT2_TIMEOUT}"
          export ALSO_TRANSPILE_VIA_CALLBACKS=true
          echo "ALSO_TRANSPILE_VIA_CALLBACKS=${ALSO_TRANSPILE_VIA_CALLBACKS}"
          
          bin/build.cmd test --suffixes ${{ matrix. testSuffix }}

  # SystemTestingTests' QEMU half (HAMR_ST_QEMU): it builds the generated Microkit images and
  # runs the system tests and the monitor images under QEMU.  The job above runs the same suite
  # without it, since its container has no Microkit SDK, sDDF, QEMU or aarch64 Rust toolchain;
  # this one runs in the provers image INSPECTA-models' Docker CI uses, which has them -- as of
  # when that image was last published, which is the SDK this job tests against.
  microkit-qemu:
    runs-on: ubuntu-latest
    container:
      image: jasonbelt/microkit_provers:latest
    name: 'SystemTestingTests under QEMU'
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Retrieve versions.properties
        run: |
          wget -q https://raw.githubusercontent.com/sireum/kekinian/master/versions.properties
      - name: Cache Java
        uses: actions/cache@v5
        with:
          path: bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-java
      - name: Cache Scala
        uses: actions/cache@v5
        with:
          path: bin/scala
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-scala
      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-coursier
      - name: Test
        shell: bash
        run: |
          # The image's own environment: MICROKIT_SDK, MICROKIT_BOARD, LIONSOS and the tools'
          # PATH, as INSPECTA-models' Docker CI uses it
          export HOME=/home/microkit
          source ${HOME}/bin/env.sh

          # x86_64 JVM defaults to 1MB thread stack; scalac plugin 4.20260224+ overflows during Erasure phase
          export JAVA_OPTS="-Xss4m"
          export COURSIER_CACHE=$GITHUB_WORKSPACE/cache/coursier
          cd $GITHUB_WORKSPACE

          export HAMR_ST_QEMU=1
          bin/build.cmd test --suffixes SystemTestingTests
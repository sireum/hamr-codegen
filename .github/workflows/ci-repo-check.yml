name: Check Disabled Workflows

on:
  push:
  schedule:
    - cron: "0 2 * * 6" # every sunday at 2am
  workflow_dispatch:

# a new run of this workflow on the same ref cancels the one in progress, so superseded
# pushes do not hold runners (in particular the organization's few macOS runners)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run workflow checker
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        run: python3 bin/scripts/repocheck.py
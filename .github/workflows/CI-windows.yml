name: Windows

on:
  push:
  schedule:
    - cron: "0 2 * * 6" # every sunday at 2am
  workflow_dispatch:

jobs:

  ci:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        testSuffix:
          # Rows are balanced against per-suite times from the last green Windows run. CodeGenTest_Base
          # is the longest single suite, so it runs alone and sets the floor for the whole matrix --
          # adding further rows cannot bring the run in under it.
          # SymlinkAuxCodeTest is Linux/macOS only: on Windows Os.mklink creates an NTFS junction
          # for directory targets, which Files.isSymbolicLink reports as false, so its assertions
          # cannot hold there.
          - "CodeGenTest_Base"
          - "CodegenTest_CASE"
          - "BaseBehaviorTestDynamic"
          - "GumboTest,HamrTranspileTests"
          - "BaseBehaviorTestStatic,MicrokitBehaviorTests"
          - "MicrokitTests,R2U2MonitorTests,R2U2MonitorBehaviorTests,CParserTest,SlangExp2RustTests,Ros2Tests,SysVCTest,SysVCVerusGenTest"
    name: '${{ matrix.testSuffix }}'
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Cygwin
        shell: cmd
        run: |
          choco config get cacheLocation
          choco install --no-progress cygwin
          C:\tools\cygwin\cygwinsetup.exe -qgnNdO -R C:/tools/cygwin -s http://mirrors.kernel.org/sourceware/cygwin/ -P gcc-core,gcc-g++,make,cmake
      - name: Retrieve versions.properties
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/sireum/kekinian/master/versions.properties" -OutFile "versions.properties"
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: bin\win\java
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: bin\scala
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: cache\coursier
          key: ${{ runner.os }}-${{ hashFiles('versions.properties') }}-coursier
      - name: Cache OSATE
        id: cache-osate
        uses: actions/cache@v5
        with:
          path: bin\win\osate
          key: ${{ runner.os }}-${{ hashFiles('jvm\src\main\resources\phantom_versions.properties') }}-osate
      - name: Check LongPathsEnabled
        run: |
          (Get-ItemProperty "HKLM:System\CurrentControlSet\Control\FileSystem").LongPathsEnabled
      - name: Test
        shell: cmd
        run: |
          xcopy %GITHUB_WORKSPACE%\cache\coursier %HOMEDRIVE%%HOMEPATH%\cache\coursier\ /E/H
          set COURSIER_CACHE=%HOMEDRIVE%%HOMEPATH%\cache\coursier
          set PATH=C:\tools\cygwin\bin;C:\tools\cygwin\usr\bin;%PATH%
          set CC=gcc.exe
          set CXX=c++.exe
          cd /d %GITHUB_WORKSPACE%
          
          rem x86_64 JVM defaults to 1MB thread stack; scalac plugin 4.20260224+ overflows during
          rem the Erasure phase. Revealed by GumboTest's initialize-entrypoint, which fails while
          rem compiling its generated s_impl_Instance module with "error: java.lang.StackOverflowError
          rem / Error invoking Scala compiler: null". Same setting as CI_linux.yml -- macOS runners
          rem are ARM64 and default to 2MB, so only the two x86_64 platforms need it. Quotes are
          rem deliberately absent: cmd would make them part of the value.
          set JAVA_OPTS=-Xss4m

          rem see https://github.com/sireum/osate-plugin/blob/57785407d84793cf1f8d5926647e4dc75ab197a9/org.sireum.aadl.osate.cli/src/org/sireum/aadl/osate/cli/Phantom.java#L508-L517
          set CHECK_PHANTOM_HAMR_API_COMPATIBILITY=true
          
          set testmodes=compile,sergen,slangcheck,phantom,tipe,ive,generated_unit_tests,smt2
          echo testmodes=%testmodes%
          set SMT2_TIMEOUT=180000
          echo SMT2_TIMEOUT=%SMT2_TIMEOUT%
          set ALSO_TRANSPILE_VIA_CALLBACKS=true
          echo ALSO_TRANSPILE_VIA_CALLBACKS=%ALSO_TRANSPILE_VIA_CALLBACKS%

          call bin\build.cmd test --suffixes ${{ matrix.testSuffix }} || goto :error
          
          goto :EOF
          :error
          exit /b %errorlevel%

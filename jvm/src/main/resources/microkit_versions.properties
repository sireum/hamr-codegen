# rust toolchain -- must match the toolchain the verus-release below was built
# against, as reported by `verus --version`
rust-channel=1.99.1


##############################
# crates.io dependencies
##############################
linux-raw-sys=0.12.1
log=0.4.34
r2u2=4.2.4
# heap for the test controller, which runs proptest on target (TestSchedulerPlugin)
linked_list_allocator=0.10.6
vstd=0.0.0-2026-10-25-0158
verus_builtin=0.0.0-2026-10-11-0230
verus_builtin_macros=0.0.0-2026-10-25-0158
# Vest's runtime library, for developer crates generated from .vest formats. Not
# emitted by codegen; recorded because vest_lib pins vstd exactly, and the Verus
# crates above must be the ones this release of vest_lib requires.
vest_lib=0.2.3


##############################
# crates.io dev-dependencies
##############################
lazy_static=1.5.1
once_cell=1.21.4
serial_test=4.0.1
proptest=1.12.0
env_logger=0.11.11


##############################
# github tagged rust releases
##############################
sel4=v5.0.0
sel4-logging=v5.0.0
r2u2-c=4.2-release


##############################
# tool versions
##############################
microkit-sdk=2.3.1
lionsos=7554a0f
sdfgen=0.35.0
# Pinned to the Verus release that Vest (https://github.com/secure-foundations/vest)
# builds against, not the latest Verus: Vest pins vstd exactly, so generated crates
# can only depend on Vest-generated parser crates when both use the same Verus.
verus-release=0.2026.10.26.d17fbd0
# The Z3 that verus-release requires (its source/tools/get-z3.sh); Verus refuses to run
# against any other. Not every Verus release asset bundles it -- 0.2026.09.06's did not --
# in which case provers-env installs this version from the Z3 releases.
z3=4.16.0
# Vest's .vest-to-Rust code generator, released together with vest_lib
vest=0.2.3
